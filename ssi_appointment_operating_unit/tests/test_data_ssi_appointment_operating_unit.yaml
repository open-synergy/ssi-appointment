        save_as: "ou_restricted"
        values:
          name: "OU Restricted Test Appointment Request"
          code: "OURESTRICTEDTESTAR"
          partner_id: "REC: company.partner_id.id"

      - step: "Create user without access to main operating unit"
        action: "create"
        model: "res.users"
        save_as: "restricted_user"
        values:
          name: "Restricted OU User Request"
          login: "restricted_ou_user_request@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_appointment_request.appointment_request_user_group"
                - "REF: ssi_appointment_operating_unit.appointment_request_ou_group"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "REC: ou_restricted.id"

      - step: "Create appointment_request with main operating unit"
        action: "create"
        model: "appointment_request"
        save_as: "record"
        as_user: "base.user_admin"
        values:
          title: "Test Appointment Request OU Restricted"
          partner_id: "REC: req_contact.id"
          type_id: "REC: appt_type.id"
          date: 2026-12-11
          date_offset: 1
          appointment_method: "online"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Restricted user cannot read the record"
        action: "call"
        target: "record"
        method: "read"
        args:
          - - "title"
        as_user: "restricted_user"
        expect_error:
          type: "AccessError"

      - step: "Restricted user cannot write the record"
        action: "write"
        target: "record"
        as_user: "restricted_user"
        expect_error:
          type: "AccessError"
        values:
          title: "Hacked Title"
